<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Room</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #f7f7f7;
      }
      .chat-container {
        max-width: 600px;
        margin: 40px auto;
      }
      .chat-box {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 15px;
        height: 400px;
        overflow-y: auto;
        background-color: white;
      }
      .message-input {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      .chat-message {
        max-width: 70%;
        padding: 10px 15px;
        border-radius: 15px;
        margin-bottom: 10px;
        clear: both;
      }

      .my-message {
        background-color: #c6f2f8;
        float: right;
        text-align: right;
      }

      .other-message {
        background-color: #f1f0f0;
        float: left;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div class="container chat-container">
      <h2 class="text-center mb-4">Join Chat Room</h2>
      <form id="join-form" class="mb-3">
        <div class="mb-3">
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Enter your name"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="text"
            id="room"
            class="form-control"
            placeholder="Enter room code"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Join</button>
      </form>

      <div id="chat-area" class="d-none">
        <div class="chat-box" id="chat-box"></div>
        <form id="chat-form">
          <div class="message-input">
            <input
              type="text"
              id="msg-input"
              class="form-control"
              placeholder="Type a message"
              required
            />
            <button type="submit" class="btn btn-success">Send</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
      const socket = io();
      let username, room;

      const joinForm = document.getElementById("join-form");
      const chatForm = document.getElementById("chat-form");
      const chatBox = document.getElementById("chat-box");
      const chatArea = document.getElementById("chat-area");

      joinForm.addEventListener("submit", (e) => {
        e.preventDefault();
        username = document.getElementById("username").value.trim();
        room = document.getElementById("room").value.trim();
        if (username && room) {
          socket.emit("join", { username, room });
          joinForm.classList.add("d-none");
          chatArea.classList.remove("d-none");
        }
      });

      chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg-input").value.trim();
        if (msg) {
          socket.emit("message", { username, room, msg });
          document.getElementById("msg-input").value = "";
        }
      });

      socket.on("message", (data) => {
        const div = document.createElement("div");
        div.classList.add("chat-message");

        if (data.username === username) {
          div.classList.add("my-message");
        } else {
          div.classList.add("other-message");
        }

        div.innerHTML = `<strong>${data.username}</strong>: ${data.msg}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    </script>
  </body>
</html>
