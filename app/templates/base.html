<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Text & File Share{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <style>
      body {
        background-color: #f8f9fa;
        margin: 0;
      }
      .offcanvas-body .nav-link {
        padding: 10px;
        font-size: 1.1rem;
      }
      main {
        padding-top: 80px; /* 👈 ensures content is not hidden under navbar */
      }
    </style>
  </head>
  <body>
    <!-- 🔝 Navbar with Hamburger -->
    <nav class="navbar navbar-light bg-light fixed-top">
      <div class="container-fluid">
        <button
          class="btn btn-outline-secondary"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebarMenu"
          aria-controls="sidebarMenu"
        >
          ☰
        </button>
        <span class="navbar-brand mb-0 h1">Essentials!</span>
      </div>
    </nav>

    <!-- 📂 Offcanvas Sidebar -->
    <div
      class="offcanvas offcanvas-start"
      tabindex="-1"
      id="sidebarMenu"
      aria-labelledby="sidebarLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarLabel">Menu</h5>
        <button
          type="button"
          class="btn-close text-reset"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('main.index') }}"
              >Send Files</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('main.retrieve') }}"
              >Retrieve Files</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('main.convert_py_to_txt') }}"
              >Convert py to txt</a
            >
          </li>
        </ul>
      </div>
    </div>

    <!-- 🧱 Main Page Content -->
    <!-- In base.html -->
    <main class="container pt-4 mt-4">{% block content %}{% endblock %}</main>
  </body>
</html>
